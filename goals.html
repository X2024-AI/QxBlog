<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>我的目标 - Qx-杨骞玺</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
    <meta name="description" content="了解我的人生目标和规划">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .goals-section {
            padding: 120px 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .goals-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .goals-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .goal-card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .goal-card:hover {
            transform: translateY(-10px);
        }

        .goal-icon {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .goal-title {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-family: var(--font-heading);
        }

        .goal-description {
            color: var(--text-color);
            line-height: 1.6;
        }

        .flag-section {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .flag-title {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 2rem;
            font-family: var(--font-heading);
        }

        .flag-list {
            list-style: none;
            padding: 0;
        }

        .flag-item {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: var(--background-color);
            border-radius: 5px;
            transition: transform 0.3s ease;
        }

        .flag-item:hover {
            transform: translateX(10px);
        }

        .flag-icon {
            color: var(--secondary-color);
            font-size: 1.5rem;
            margin-right: 1rem;
        }

        @media screen and (max-width: 768px) {
            .goals-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">

            <a href="index.html">Qx-杨骞玺</a>

            <li><a href="hobbies.html">爱好与习惯</a></li>
        </ul>
    </nav>

    <!-- 目标部分 -->
    <section class="goals-section">
        <div class="goals-header">
            <h1>我的人生志向</h1>
        </div>
        
        <div class="goals-container">
            <div class="goal-card">
                <i class="fas fa-rocket goal-icon"></i>
                <h3 class="goal-title">短期目标</h3>
                <p class="goal-description">靠自己的产品赚到第一个百万</p>
            </div>

            <div class="goal-card">
                <i class="fas fa-building goal-icon"></i>
                <h3 class="goal-title">中期目标</h3>
                <p class="goal-description">开公司创造价值，实现财富自由</p>
            </div>

            <div class="goal-card">
                <i class="fas fa-globe goal-icon"></i>
                <h3 class="goal-title">长期目标</h3>
                <p class="goal-description">为人类做点事情</p>
            </div>
        </div>

        <div class="flag-section">
            <h2 class="flag-title">2025年Flag</h2>
            <ul class="flag-list">
                <li class="flag-item">
                    <i class="fas fa-money-bill-wave flag-icon"></i>
                    <span>实现财务独立</span>
                </li>
                <li class="flag-item">
                    <i class="fas fa-book flag-icon"></i>
                    <span>阅读至少100本书</span>
                </li>
                <li class="flag-item">
                    <i class="fas fa-running flag-icon"></i>
                    <span>跑量达365km</span>
                </li>
            </ul>
        </div>
    </section>
